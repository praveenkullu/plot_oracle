"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Meta {
  status: JSON
}

type Query {
  claim(id: String!): claim
  claims(where: claimFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): claimPage!
  challengeWindow(id: String!): challengeWindow
  challengeWindows(where: challengeWindowFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): challengeWindowPage!
  voteRecord(id: String!): voteRecord
  voteRecords(where: voteRecordFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): voteRecordPage!
  emission(id: String!): emission
  emissions(where: emissionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): emissionPage!
  _meta: Meta
}

type claim {
  id: String!
  contentHash: String!
  submitter: String!
  bond: BigInt!
  status: String!
  selfDeclaredDomain: Int!
  voterAssignedDomain: Int
  domainFinalized: Boolean!
  confidenceScore: Int
  submittedAt: BigInt!
  previousVersion: String
  nextVersion: String
  noveltyPassed: Boolean
}

type claimPage {
  items: [claim!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

